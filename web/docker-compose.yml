services:
  pa-agent-web:
    # Pre-built image — Dockerfile builds fail on this LXC host due to
    # AppArmor, so we build manually via `docker run --security-opt apparmor=unconfined`
    # then commit.  See web/Dockerfile for the recipe.
    image: pa-agent-web:latest
    ports:
      - "8005:8000"
    volumes:
      - ../config:/app/config
      - ../records:/app/records
      - ../logs:/app/logs
    restart: unless-stopped
