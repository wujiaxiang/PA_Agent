services:
  pa-agent-web:
    # Pre-built image — Dockerfile builds fail on this LXC host due to
    # AppArmor, so we build manually via `docker run --security-opt apparmor=unconfined`
    # then commit.  See web/Dockerfile for the recipe.
    image: pa-agent-web:latest
    security_opt:
      - apparmor=unconfined
    ports:
      - "8005:8000"
    volumes:
      - ../config:/app/config
      - ../records:/app/records
      - ../logs:/app/logs
      # 交易记录 CSV + K 线图 PNG：下单信号后由 trade_logger 写入。
      # 不挂载的话容器重建即丢失，飞书卡片也拿不到 chart_image。
      - ../trade_records:/app/trade_records
      - ../experience:/app/experience
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
