name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Verify install
        run: python -c "import pa_agent; print('OK')"

  e2e:
    name: 端到端测试（Playwright）
    runs-on: ubuntu-latest
    # 与 unit test 独立：E2E 需要起真实服务 + 浏览器，慢且重，
    # 不应阻塞 PR 的快速反馈。但失败必须红。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install playwright pytest pytest-asyncio
          python -m playwright install --with-deps chromium

      - name: Start server (E2E mode)
        env:
          # 服务端据此注册播种端点；生产环境该路由不存在
          PA_AGENT_E2E: "1"
        run: |
          nohup python -m uvicorn web.server:app --host 127.0.0.1 --port 8000 \
            > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server failed to start"; tail -50 /tmp/server.log; exit 1

      - name: Run E2E tests
        env:
          PA_AGENT_E2E_BASE_URL: "http://127.0.0.1:8000"
        run: |
          pytest tests/e2e -p no:cacheprovider -q -s

      - name: Server log on failure
        if: failure()
        run: tail -80 /tmp/server.log

  write-scope:
    name: 多会话写入范围检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1) 改了代码却没更新 SESSION_CHANGES.md → 失败（强制登记纪律）
      # 2) 改动命中他人「进行中」范围 → 仅告警：正在干活的那个会话自己
      #    落地成果时必然命中自己的范围，硬阻断只会逼人绕过检查
      - name: Resolve base ref
        id: base
        run: |
          # push 事件里 github.event.before 可能是全零 SHA（首次推送/force push），
          # 直接拿去 git diff 会报错。用 fetch-depth:0 拿到的浅层历史兜底：
          # 取 HEAD~1，取不到就跳过检查（不能因为拿不到基线就让 CI 变红）。
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Check write scopes
        run: |
          if [ -z "${{ steps.base.outputs.base }}" ]; then
            echo "::notice::无法确定基线 ref，跳过写入范围检查"
            exit 0
          fi
          python tools/check_write_scope.py --ci \
            --base "${{ steps.base.outputs.base }}" \
            --head "${{ github.sha }}"
