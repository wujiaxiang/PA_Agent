name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支连续 push 时取消上一轮，避免堆一串过期 run（既浪费额度，
# 又容易让人看错「最新结果」）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认权限收紧：CI 只需读代码
permissions:
  contents: read

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    # 原先跑 windows-latest，但项目实际部署是 Docker/Linux，且
    # MetaTrader5 是 win32 专属依赖 —— Linux 上会缺，与生产不一致。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # [dev] extra 此前**并未定义**，`pip install -e ".[dev]"` 只 warning
          # 后继续 —— 于是「装好了」却没装到 pytest，CI 显示绿灯而一条测试
          # 都没跑。现在 extra 已补齐（pyproject.toml）。
          pip install -e ".[dev,web]"

      - name: Verify install
        run: python -c "import pa_agent; print('OK')"

      - name: Run unit tests
        env:
          # Qt 无显示环境；tests/conftest.py 已把 DB 重定向到临时目录，
          # 不会碰生产数据
          QT_QPA_PLATFORM: offscreen
        run: |
          # pytest 本身失败（存量）不能让 job 停在这里 —— 要拿到完整输出
          # 才能与基线比对。真正的判定在下一步。
          pytest tests/unit -p no:cacheprovider > /tmp/pytest.log 2>&1 || true
          tail -30 /tmp/pytest.log

      - name: Diff against known-failure baseline
        run: |
          # 只对**新增**失败红。存量 FAILED/ERROR 是正在重构中的经验库 /
          # 存储层代码，直接跑会让 CI 永久红 —— 那等于把 CI 关掉。
          python tools/ci_diff_baseline.py \
            --log /tmp/pytest.log \
            --baseline tests/ci/baseline_failures.txt

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: /tmp/pytest.log
          retention-days: 7

  frontend:
    name: 前端单测（Node / vm 直跑 app.js）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 与 unit test 独立：这批用 Node + vm + 最小 DOM 桩**真的执行** app.js/api.js，
    # 不需要 Python 依赖，跑完是秒级。单独成 job 是为了让「前端测试挂了」在
    # CI 界面上是一眼能看见的一行，而不是混在 pytest 的失败里。
    #
    # 为什么要接进 CI：AGENTS.md「测试必须接进 CI 才算数」。本轮新增的
    # 历史列表竞态守卫、交易所标注与注入防护、游标回显、轮询模式共 38 条
    # 前端测试曾一度只存在于仓库里 —— 每次改动照样没人被拦。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check
        run: node --check web/static/js/app.js

      - name: Run frontend tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/js/*.test.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有找到 tests/js/*.test.js —— 用例被删空了吗？"
            exit 1
          fi
          failed=0
          for f in "${files[@]}"; do
            echo "::group::$f"
            node "$f" || failed=1
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "前端测试失败（见上方各分组）"
            exit 1
          fi
          echo "全部 ${#files[@]} 个前端测试文件通过"

  e2e:
    name: 端到端测试（Playwright）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 与 unit test 独立：E2E 需要起真实服务 + 浏览器，慢且重，
    # 不应阻塞 PR 的快速反馈。但失败必须红。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 必须带 [web]：fastapi / uvicorn / sse-starlette 都在这个 extra 里，
          # 只装核心依赖的话 uvicorn 根本不存在，服务起不来。
          # playwright 已含在 [dev] 中。
          pip install -e ".[web,dev]"
          python -m playwright install --with-deps chromium

      - name: Start server (E2E mode)
        env:
          # 服务端据此注册播种端点；生产环境该路由不存在
          PA_AGENT_E2E: "1"
        run: |
          nohup python -m uvicorn web.server:app --host 127.0.0.1 --port 8000 \
            > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server failed to start"; tail -50 /tmp/server.log; exit 1

      - name: Run E2E tests
        env:
          PA_AGENT_E2E_BASE_URL: "http://127.0.0.1:8000"
        run: |
          pytest tests/e2e -p no:cacheprovider -q -s

      - name: Server log on failure
        if: failure()
        run: tail -80 /tmp/server.log

  write-scope:
    name: 多会话写入范围检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1) 改了代码却没更新 SESSION_CHANGES.md → 失败（强制登记纪律）
      # 2) 改动命中他人「进行中」范围 → 仅告警：正在干活的那个会话自己
      #    落地成果时必然命中自己的范围，硬阻断只会逼人绕过检查
      - name: Resolve base ref
        id: base
        run: |
          # push 事件里 github.event.before 可能是全零 SHA（首次推送/force push），
          # 直接拿去 git diff 会报错。用 fetch-depth:0 拿到的浅层历史兜底：
          # 取 HEAD~1，取不到就跳过检查（不能因为拿不到基线就让 CI 变红）。
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Check write scopes
        run: |
          if [ -z "${{ steps.base.outputs.base }}" ]; then
            echo "::notice::无法确定基线 ref，跳过写入范围检查"
            exit 0
          fi
          python tools/check_write_scope.py --ci \
            --base "${{ steps.base.outputs.base }}" \
            --head "${{ github.sha }}"
